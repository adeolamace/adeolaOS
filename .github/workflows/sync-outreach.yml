name: Sync outreach from ColdEmail
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ColdEmail
        run: git clone --depth 1 https://github.com/modedigicreations/ColdEmail.git /tmp/coldemail
      - name: Copy into outreach
        run: rsync -a --delete --exclude='.git' /tmp/coldemail/ outreach/
      - name: Commit if changed
        run: |
          git config user.name "outreach-sync"
          git config user.email "actions@users.noreply.github.com"
          git add outreach
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "sync: outreach from ColdEmail $(git -C /tmp/coldemail rev-parse --short HEAD)"
          git push
